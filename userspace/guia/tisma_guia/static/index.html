<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía TISMA</title>
<style>
:root { --bg:#f6f5f9; --panel:#fff; --borde:#e2dfea; --txt:#1e1c24; --suave:#5d5a68; --acento:#8b3fe0; }
@media (prefers-color-scheme: dark) { :root { --bg:#18171c; --panel:#232229; --borde:#34323c; --txt:#ececf1; --suave:#a3a1ad; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--txt); font:18px/1.55 Inter, system-ui, sans-serif; }
main { max-width:760px; margin:0 auto; padding:28px 24px 48px; }
header { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
header img { width:34px; } header b { font-size:22px; }
#buscar { width:100%; font:inherit; padding:14px 18px; border-radius:14px; border:1px solid var(--borde);
          background:var(--panel); color:var(--txt); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-top:20px; }
.card { background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:20px 18px; cursor:pointer;
        text-align:left; font:inherit; font-weight:600; color:inherit; }
.card:hover, .fila:hover { border-color:var(--acento); }
.fila { display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--borde); border-radius:12px;
        padding:12px 16px; margin-bottom:8px; font:inherit; color:inherit; cursor:pointer; }
.cat { color:var(--suave); font-size:15px; font-weight:600; margin:22px 0 8px; }
h1 { font-size:28px; margin:8px 0 6px; } .resumen { color:var(--suave); margin:0 0 18px; }
.foto { width:100%; border-radius:12px; border:1px solid var(--borde); margin:4px 0 18px; }
ol { padding:0; margin:0; list-style:none; counter-reset:paso; }
ol li { counter-increment:paso; display:flex; gap:14px; align-items:flex-start; margin-bottom:14px; }
ol li::before { content:counter(paso); flex:none; width:32px; height:32px; border-radius:50%; background:var(--acento);
                color:#fff; font-weight:700; display:grid; place-items:center; }
button.btn { background:var(--acento); color:#fff; border:0; border-radius:12px; padding:13px 22px; font:inherit;
             font-weight:600; cursor:pointer; margin-top:10px; }
button.link { background:none; border:0; color:var(--acento); font:inherit; font-weight:600; cursor:pointer; padding:8px 0; }
#aviso { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 16px;
         border-radius:10px; display:none; }
</style>
</head>
<body>
<main>
  <header><img src="/static/logo.svg" alt=""><b>Guía TISMA</b></header>
  <input id="buscar" type="search" placeholder="¿Qué quieres hacer? Ej.: wifi, imprimir, instalar…" aria-label="Buscar en la guía">
  <div id="vista"></div>
</main>
<div id="aviso" role="status"></div>
<script>
const TOKEN = "__TOKEN__";
// Inicio corto: lo que más se busca. El resto, en «Ver todos los temas».
const PRINCIPALES = ["menu", "wifi", "archivos", "usb", "tienda", "problemas"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (ruta, cuerpo) => {
  const r = await fetch(ruta, {method: cuerpo ? "POST" : "GET", headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
                               body: cuerpo ? JSON.stringify(cuerpo) : undefined});
  const d = await r.json(); if (!r.ok) throw new Error(d.error || "error"); return d;
};
let datos = {categorias: [], lecciones: []};
const porId = id => datos.lecciones.find(l => l.id === id);
function aviso(t) { const a = $("#aviso"); a.textContent = t; a.style.display = "block"; setTimeout(() => a.style.display = "none", 2600); }
function enlazar() { $("#vista").querySelectorAll("[data-l]").forEach(b => b.onclick = () => ver(b.dataset.l)); }
const tarjetas = ids => `<div class="grid">${ids.map(porId).filter(Boolean).map(l =>
  `<button class="card" data-l="${l.id}">${esc(l.titulo)}</button>`).join("")}</div>`;

function inicio() {
  $("#vista").innerHTML = tarjetas(PRINCIPALES) + `<p><button class="link" id="todos">Ver todos los temas</button></p>`;
  enlazar(); $("#todos").onclick = todos;
}

function todos() {
  $("#vista").innerHTML = `<p><button class="link" id="volver">← Volver</button></p>` +
    datos.categorias.map(([c, nombre]) => `<div class="cat">${esc(nombre)}</div>` + datos.lecciones.filter(l => l.cat === c)
      .map(l => `<button class="fila" data-l="${l.id}">${esc(l.titulo)}</button>`).join("")).join("");
  enlazar(); $("#volver").onclick = inicio;
}

function resultados(ids) {
  $("#vista").innerHTML = ids.length ? ids.map(porId).map(l => `<button class="fila" data-l="${l.id}">${esc(l.titulo)}</button>`).join("")
    : `<p class="resumen" style="margin-top:20px">No encontré nada. Prueba con otras palabras, por ejemplo «wifi» o «imprimir».</p>`;
  $("#vista").style.marginTop = "16px"; enlazar();
}

function ver(id) {
  const l = porId(id);
  $("#vista").innerHTML = `<p><button class="link" id="volver">← Volver</button></p><h1>${esc(l.titulo)}</h1>` +
    `<p class="resumen">${esc(l.resumen)}</p>` +
    (l.imagen ? `<img class="foto" src="/img/${esc(l.imagen)}" alt="" onerror="this.remove()">` : "") +
    `<ol>${l.pasos.map(p => `<li><div>${esc(p)}</div></li>`).join("")}</ol>` +
    (l.probar ? `<button class="btn" id="probar">Probar ahora</button>` : "");
  $("#volver").onclick = () => { $("#buscar").value = ""; inicio(); };
  if (l.probar) $("#probar").onclick = async () => {
    try { await api("/api/probar", {accion: l.probar}); aviso("Abriendo…"); } catch (e) { aviso(e.message); }
  };
  window.scrollTo(0, 0);
}

let t = null;
$("#buscar").oninput = () => { clearTimeout(t); t = setTimeout(async () => {
  const q = $("#buscar").value.trim();
  if (!q) return inicio();
  resultados((await api("/api/buscar?q=" + encodeURIComponent(q))).ids);
}, 250); };

(async () => { datos = await api("/api/lecciones"); inicio(); })();
</script>
</body>
</html>
