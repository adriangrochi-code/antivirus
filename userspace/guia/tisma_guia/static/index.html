<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía TISMA</title>
<style>
:root { --bg:#f4f3f7; --panel:#fff; --lado:#ecebf2; --borde:#dedbe6; --txt:#1e1c24; --suave:#5d5a68; --acento:#8b3fe0;
        --acento-suave:#efe5fc; }
@media (prefers-color-scheme: dark) { :root { --bg:#18171c; --panel:#232229; --lado:#1d1c22; --borde:#34323c;
        --txt:#ececf1; --suave:#a3a1ad; --acento-suave:#2e2540; } }
* { box-sizing: border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--txt); font:16.5px/1.55 Inter, system-ui, sans-serif;
       display:grid; grid-template-columns:270px 1fr; }
aside { background:var(--lado); border-right:1px solid var(--borde); padding:18px 14px; overflow:auto; }
aside header { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; }
aside header img { width:30px; } aside header b { font-size:18px; }
.cat { font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--suave); font-weight:600;
       margin:16px 8px 6px; }
.item { display:block; width:100%; text-align:left; background:none; border:0; color:var(--txt); font:inherit;
        padding:7px 10px; border-radius:8px; cursor:pointer; }
.item:hover { background:var(--panel); } .item.sel { background:var(--acento-suave); color:var(--acento); font-weight:600; }
main { overflow:auto; padding:24px 34px 40px; }
#buscar { width:100%; max-width:620px; font:inherit; padding:12px 16px; border-radius:12px; border:1px solid var(--borde);
          background:var(--panel); color:var(--txt); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; margin-top:18px; }
.card { background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:16px; cursor:pointer; text-align:left;
        font:inherit; color:inherit; }
.card:hover { border-color:var(--acento); }
.card b { display:block; font-size:16.5px; margin-bottom:4px; } .card span { color:var(--suave); font-size:14.5px; }
h1 { font-size:28px; margin:6px 0 6px; } .resumen { color:var(--suave); font-size:17.5px; margin:0 0 18px; }
.leccion { max-width:860px; }
.foto { width:100%; border-radius:12px; border:1px solid var(--borde); margin:6px 0 18px; }
ol { padding:0; margin:0; list-style:none; counter-reset:paso; }
ol li { counter-increment:paso; display:flex; gap:14px; align-items:flex-start; background:var(--panel);
        border:1px solid var(--borde); border-radius:12px; padding:14px 16px; margin-bottom:10px; font-size:17px; }
ol li::before { content:counter(paso); flex:none; width:32px; height:32px; border-radius:50%; background:var(--acento);
                color:#fff; font-weight:700; display:grid; place-items:center; }
.botones { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
button.btn { background:var(--acento); color:#fff; border:0; border-radius:10px; padding:11px 18px; font:inherit;
             font-weight:600; cursor:pointer; }
button.sec { background:transparent; color:var(--txt); border:1px solid var(--borde); }
#aviso { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 16px;
         border-radius:10px; display:none; }
@media (max-width:760px) { body { grid-template-columns:1fr; } aside { display:none; } }
</style>
</head>
<body>
<aside><header><img src="/static/logo.svg" alt=""><b>Guía TISMA</b></header><div id="indice"></div></aside>
<main>
  <input id="buscar" type="search" placeholder="¿Qué quieres hacer? Por ejemplo: conectarme al wifi, imprimir, instalar…"
         aria-label="Buscar en la guía">
  <div id="vista"></div>
</main>
<div id="aviso" role="status"></div>
<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (ruta, cuerpo) => {
  const r = await fetch(ruta, {method: cuerpo ? "POST" : "GET", headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
                               body: cuerpo ? JSON.stringify(cuerpo) : undefined});
  const d = await r.json(); if (!r.ok) throw new Error(d.error || "error"); return d;
};
let datos = {categorias: [], lecciones: []}, actual = null;
const porId = id => datos.lecciones.find(l => l.id === id);

function aviso(t) { const a = $("#aviso"); a.textContent = t; a.style.display = "block"; setTimeout(() => a.style.display = "none", 2600); }

function indice() {
  $("#indice").innerHTML = `<button class="item ${actual ? "" : "sel"}" data-inicio>Inicio</button>` +
    datos.categorias.map(([c, nombre]) => `<div class="cat">${esc(nombre)}</div>` +
      datos.lecciones.filter(l => l.cat === c).map(l =>
        `<button class="item ${actual === l.id ? "sel" : ""}" data-l="${l.id}">${esc(l.titulo)}</button>`).join("")).join("");
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => ver(b.dataset.l));
  $("[data-inicio]").onclick = () => inicio();
}

function tarjetas(ids) {
  return `<div class="grid">${ids.map(porId).map(l =>
    `<button class="card" data-l="${l.id}"><b>${esc(l.titulo)}</b><span>${esc(l.resumen)}</span></button>`).join("")}</div>`;
}

function inicio(ids) {
  actual = null; indice();
  $("#vista").innerHTML = ids ? (ids.length ? tarjetas(ids) : `<p class="resumen" style="margin-top:20px">No encontré nada. Prueba con otras palabras, por ejemplo «wifi», «imprimir» o «virus».</p>`)
    : `<h1 style="margin-top:22px">Aprende a usar tu equipo</h1><p class="resumen">Elige un tema. Cada uno son pocos pasos, y con «Probar» abres esa función.</p>` +
      tarjetas(datos.lecciones.map(l => l.id));
  $("#vista").querySelectorAll("[data-l]").forEach(b => b.onclick = () => ver(b.dataset.l));
}

function ver(id) {
  const l = porId(id), i = datos.lecciones.indexOf(l);
  actual = id; indice();
  const ant = datos.lecciones[i - 1], sig = datos.lecciones[i + 1];
  $("#vista").innerHTML = `<div class="leccion"><h1 style="margin-top:20px">${esc(l.titulo)}</h1><p class="resumen">${esc(l.resumen)}</p>` +
    (l.imagen ? `<img class="foto" src="/img/${esc(l.imagen)}" alt="${esc(l.titulo)}">` : "") +
    `<ol>${l.pasos.map(p => `<li><div>${esc(p)}</div></li>`).join("")}</ol>` +
    `<div class="botones">${l.probar ? `<button class="btn" id="probar">Probar ahora</button>` : ""}` +
    (ant ? `<button class="btn sec" data-l="${ant.id}">← ${esc(ant.titulo)}</button>` : "") +
    (sig ? `<button class="btn sec" data-l="${sig.id}">${esc(sig.titulo)} →</button>` : "") + `</div></div>`;
  $("#vista").querySelectorAll("[data-l]").forEach(b => b.onclick = () => ver(b.dataset.l));
  if (l.probar) $("#probar").onclick = async () => {
    try { await api("/api/probar", {accion: l.probar}); aviso("Abriendo…"); } catch (e) { aviso(e.message); }
  };
  document.querySelector("main").scrollTop = 0;
}

let t = null;
$("#buscar").oninput = () => { clearTimeout(t); t = setTimeout(async () => {
  const q = $("#buscar").value.trim();
  if (!q) return inicio();
  inicio((await api("/api/buscar?q=" + encodeURIComponent(q))).ids);
}, 250); };

(async () => { datos = await api("/api/lecciones"); inicio(); })();
</script>
</body>
</html>
