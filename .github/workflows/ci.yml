# TISMA OS: integración continua.
# - pruebas: todas las suites (make test) en cada cambio.
# - comprobaciones: sintaxis de scripts (bash, Python, GRUB), JSON, shellcheck y que todos los paquetes de la ISO
#   existan en Debian trixie.
# - iso-minima (manual): compila el kernel mínimo, construye la ISO mínima y la arranca en QEMU.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      iso_minima:
        description: "Construir y arrancar la ISO mínima (≈1 h)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias
        run: |
          # Python desde PyPI (los espejos de Ubuntu del runner fallan a veces al resolver el DNS)
          python3 -m pip install --user --break-system-packages -q pytest numpy pyyaml psutil watchdog
          # pytest también para todo el sistema: la verificación de TISMA Code lo corre en una jaula sin la carpeta personal
          sudo python3 -m pip install --break-system-packages -q pytest || true
          # bubblewrap (la jaula de TISMA Code) y GRUB: con reintentos; si fallan, esas pruebas se saltan solas
          sudo apt-get -o Acquire::Retries=5 update -q || true
          sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends bubblewrap grub-common || true
          # Ubuntu 24.04 restringe los espacios de nombres sin privilegios por AppArmor: bubblewrap los necesita
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Pruebas (make test)
        run: make test

  comprobaciones:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Herramientas
        run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends shellcheck grub-common
      - name: Scripts de shell (sintaxis y shellcheck nivel error)
        run: |
          files=$(find rootfs iso kernel tests -type f -exec grep -l '^#!.*\(bash\|/sh\)' {} +)
          for f in $files; do bash -n "$f"; done
          shellcheck -S error $files
      - name: Python (también los scripts sin extensión de rootfs)
        run: |
          python3 -m compileall -q userspace iso kernel
          for f in $(grep -rl '^#!.*python' rootfs iso kernel); do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])" "$f"
          done
      - name: JSON
        run: for f in $(find rootfs -name '*.json'); do python3 -m json.tool "$f" > /dev/null; done
      - name: Fragmento de GRUB (prueba de arranque del driver gráfico)
        run: sh rootfs/etc/grub.d/05_tisma_graficos > /tmp/s.cfg && grub-script-check /tmp/s.cfg
      - name: Paquetes de la ISO en Debian trixie
        run: python3 iso/check-packages.py

  iso-minima:
    if: github.event_name == 'workflow_dispatch' && inputs.iso_minima
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias de build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential bc flex bison libssl-dev libelf-dev libdw-dev dwarves \
            debhelper debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools librsvg2-bin \
            rsync cpio zstd qemu-system-x86 busybox-static ovmf sbsigntool debian-archive-keyring dosfstools \
            python3-pil
      - name: Kernel mínimo
        run: make kernel-minimal
      - name: ISO mínima
        run: make iso-minima
      - name: Arranque en QEMU
        run: make iso-test
