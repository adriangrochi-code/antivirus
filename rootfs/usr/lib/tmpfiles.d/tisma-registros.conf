# TISMA: /var/log es un subvolumen aparte (@log). Si llega vacío (copia de seguridad restaurada, «volver atrás» de
# otra instalación, disco reparado), auditd y USBGuard no arrancaban por faltar su carpeta de registro (visto en una
# instalación de prueba). Se crean al arrancar si faltan; si ya existen, no se tocan.
d /var/log/audit 0750 root adm -
d /var/log/usbguard 0755 root root -
d /var/log/apt 0755 root root -
d /var/log/unattended-upgrades 0750 root adm -
d /var/log/clamav 0755 clamav clamav -
d /var/log/journal 2755 root systemd-journal -
