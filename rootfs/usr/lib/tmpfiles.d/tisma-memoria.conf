# TISMA: que el equipo no se «arrastre» cuando falta memoria (ajuste de ChromeOS, pensado para equipos con poca RAM).
# MGLRU (el gestor de memoria moderno del kernel) encendido del todo, y min_ttl_ms=1000: lo que se usó hace menos
# de un segundo (la ventana activa, el puntero, el sonido) NUNCA se saca de la memoria. Antes, con la RAM llena,
# el kernel expulsaba justo eso y todo se congelaba varios segundos; ahora, si de verdad no queda memoria, se
# cierra antes una pestaña o app en segundo plano (systemd-oomd) y el resto sigue fluido.
# «w-»: si el kernel no tiene MGLRU, no pasa nada.
w- /sys/kernel/mm/lru_gen/enabled    - - - - y
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
