# Escudo: estado (firmas, cuarentena, veredictos) y la carpeta donde se analizan las muestras (las copias de
# cada muestra pertenecen al usuario que la ejecutó: 0711 para que pueda atravesarla pero no listarla)
d /var/lib/escudo          0700 root root -
d /var/lib/escudo-detonar  0711 root root -
