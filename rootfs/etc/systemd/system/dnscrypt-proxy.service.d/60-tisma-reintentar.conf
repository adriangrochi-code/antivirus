# Si arranca sin red (USB live o portátil antes de conectar el wifi) y no puede preparar los servidores, Debian lo
# deja caído para siempre: sin DNS no se resuelve ningún nombre aunque luego haya conexión (visto en la
# preview 5). Se reintenta cada 10 s sin límite. Además la ISO trae la lista de servidores firmada (build-iso.sh),
# así que normalmente arranca a la primera aunque no haya red.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10
