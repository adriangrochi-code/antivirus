# Servicios diferidos: arrancan cuando el escritorio ya está visible.
# (La seguridad no se retrasa: el firewall, AppArmor, auditd, dnscrypt-proxy, USBGuard y Escudo están en la
# fase 1, y la pantalla de inicio de sesión espera a Escudo.)
[Unit]
Wants=centinela-adaptd.service centinela-power.service
Wants=clamav-freshclam.service fwupd-refresh.timer tisma-bloqueo.timer
Wants=bluetooth.service ModemManager.service
Wants=tisma-precarga.service centinela-autotune-arranque.service
