# Tarea de SEGURIDAD con el equipo libre (como mucho 6 h de espera, nunca se salta ni con la batería baja): espera a que esté enchufado y sin uso (y la IA local sin generar) en vez
# de ejecutarse a batería o en mitad del trabajo. No se salta: pasadas 12 h se ejecuta igual si la batería lo
# permite (centinela esperar-libre). Siempre con la prioridad mínima de CPU y disco.
[Service]
ExecStartPre=/usr/bin/centinela esperar-libre --seguridad
TimeoutStartSec=infinity
Nice=19
IOSchedulingClass=idle
CPUWeight=idle
