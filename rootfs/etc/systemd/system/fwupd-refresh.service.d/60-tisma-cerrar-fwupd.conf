# Tras buscar firmware nuevo, fwupd quedaba horas en memoria (~22 MB, medido en la VM) y además dejaba activados
# Bluetooth y UPower. Al terminar se cierra; si la Tienda o tisma-drivers lo necesitan, D-Bus lo vuelve a abrir.
# «+»: con privilegios (el servicio corre como un usuario sin permisos). --no-block: no espera a que termine.
[Service]
ExecStopPost=-+/usr/bin/systemctl --no-block stop fwupd.service
