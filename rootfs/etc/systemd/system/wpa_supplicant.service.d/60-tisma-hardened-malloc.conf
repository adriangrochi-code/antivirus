# Asignador de memoria endurecido de GrapheneOS (variante light): detecta y frena desbordamientos, usos tras
# liberar y dobles liberaciones en este demonio, que procesa datos de la red o de otros procesos.
# Si la biblioteca no estuviera, el cargador lo avisa y el servicio arranca igual con el asignador normal.
[Service]
Environment=LD_PRELOAD=/usr/lib/libhardened_malloc-light.so
