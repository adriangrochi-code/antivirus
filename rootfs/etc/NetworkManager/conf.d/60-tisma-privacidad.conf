# Privacidad de red (inspirado en GrapheneOS):
# - Wi-Fi: MAC aleatoria al buscar redes y una MAC NUEVA en cada conexión (una red pública no puede reconocer
#   el equipo entre visitas). Si un portal cautivo pide registrarse de nuevo, es por esto.
# - Cable: MAC estable por red y arranque (algunas redes reservan direcciones por MAC).
# - DHCP sin el nombre del equipo (el nombre suele delatar al usuario: «portatil-de-ana»).
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=stable
connection.stable-id=${CONNECTION}/${BOOT}
ipv6.ip6-privacy=2
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
