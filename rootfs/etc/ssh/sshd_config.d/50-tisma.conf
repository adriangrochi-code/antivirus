# TISMA OS: SSH endurecido (el 89 % de la actividad maliciosa en Linux es fuerza bruta contra SSH).
# sshd no viene instalado; si lo instalas, esta configuración aplica desde el primer momento.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:60
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
