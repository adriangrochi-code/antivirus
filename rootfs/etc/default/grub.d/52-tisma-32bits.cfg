# TISMA OS: sin llamadas al sistema de 32 bits (ia32_emulation=0, vdso32=0). Casi nadie las usa en un
# escritorio de 64 bits y son una superficie de ataque grande (muchas escaladas de privilegios entran por la
# capa de compatibilidad). Steam y Wine las necesitan: el perfil «juegos» (tisma-perfil) crea /etc/tisma/32bits
# y regenera GRUB; tras reiniciar vuelven a estar disponibles.
if [ ! -e /etc/tisma/32bits ]; then
    GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT ia32_emulation=0 vdso32=0"
fi
