# TISMA OS: parámetros de seguridad del kernel (centinela apply añade los
# ajustes específicos del hardware en 60-centinela-tuned.cfg)
GRUB_DISTRIBUTOR="TISMA"
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
# Mantén Mayús pulsada al encender para ver el menú
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity module.sig_enforce=1 init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on slab_nomerge vsyscall=none debugfs=off iommu.strict=1 efi=disable_early_pci_dma"
GRUB_THEME="/boot/grub/themes/centinela/theme.txt"
