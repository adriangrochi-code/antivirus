# TISMA OS: parámetros de seguridad del kernel (centinela apply añade los
# ajustes específicos del hardware en 60-centinela-tuned.cfg)
GRUB_DISTRIBUTOR="TISMA"
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
# Mantén Mayús pulsada al encender para ver el menú
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0 lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity module.sig_enforce=1 init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on slab_nomerge vsyscall=none debugfs=off iommu.strict=1 efi=disable_early_pci_dma panic=10 intel_iommu=on amd_iommu=force_isolation iommu.passthrough=0 random.trust_cpu=off random.trust_bootloader=off efi_pstore.pstore_disable=1 erst_disable proc_mem.force_override=ptrace kfence.sample_interval=100"
# (noviembre de 2026, comparado con Kicksecure) intel_iommu=on: el kernel firmado de Debian dejaba el IOMMU
# APAGADO en equipos Intel con gráfica integrada (sin protección contra DMA por USB4/Thunderbolt);
# force_isolation/passthrough=0: cada dispositivo en su propio dominio. random.trust_*=off: no fiarse del
# RDRAND de la CPU (algunos AMD lo tuvieron roto) ni de la semilla del cargador. pstore/erst: el kernel no guarda
# sus registros en la memoria del firmware. proc_mem: escribir en /proc/<pid>/mem solo con permiso de ptrace.
# kfence: el kernel de Debian lo trae APAGADO (intervalo 0); así detecta corrupciones de memoria en producción.
GRUB_THEME="/boot/grub/themes/centinela/theme.txt"
# loglevel=3, rd.udev.log_level=3, systemd.show_status=false: arranque limpio (logo y nada más).
# vt.global_cursor_default=0: sin el cursor parpadeando en la pantalla negra antes del escritorio.
# Los avisos y errores siguen en el registro (journalctl -b -p warning).
# Opciones del menú de arranque en español («Opciones avanzadas…», no «Advanced options…»)
export LANG=es_ES.UTF-8
