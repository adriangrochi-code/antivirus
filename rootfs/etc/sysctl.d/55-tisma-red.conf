# ===== TISMA OS: red rápida (carga de páginas, descargas de Steam, VPN) =====

# BBR + fq: el control de congestión de Google; llena el enlace sin llenar los búferes del router (menos
# latencia con descargas en curso). fq además reparte el envío por conexión (pacing).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP Fast Open: los datos viajan ya en el primer paquete al volver a un servidor conocido (1 RTT menos).
net.ipv4.tcp_fastopen = 3

# Conservar la ventana de congestión en conexiones que estuvieron inactivas (HTTP/2 y keep-alive): la siguiente
# página del mismo sitio no vuelve a empezar despacio.
net.ipv4.tcp_slow_start_after_idle = 0

# Marcas de tiempo TCP activadas: mejor medida del RTT, detección de retransmisiones espurias y protección PAWS
# en enlaces rápidos. (Desactivarlas era una medida antigua: desde Linux 4.10 cada conexión usa un
# desplazamiento aleatorio y ya no revelan el tiempo encendido del equipo.)
net.ipv4.tcp_timestamps = 1

# Detectar «agujeros negros» de MTU (típicos con VPN, PPPoE y redes móviles) en vez de colgarse la conexión.
net.ipv4.tcp_mtu_probing = 1

# Búferes: el autoajuste del kernel puede crecer hasta 16 MiB por conexión (el máximo por defecto, 6 MiB, limita
# las descargas rápidas con latencia alta: 1 Gbit/s a 100 ms necesita ~12 MiB). Solo se usa si hace falta.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
