# Escritura diferida acotada: por defecto el kernel acumula hasta el 20 % de la RAM (3 GB con 16 GB) antes de
# escribir, y al copiar a un USB lento el sistema se queda «congelado» vaciándolo. Con 256 MB / 64 MB los datos
# salen antes y en tandas pequeñas.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# El hilo de escritura despierta cada 15 s (no 5): menos escrituras pequeñas al SSD y menos despertares de la
# CPU. Los datos siguen saliendo como mucho a los 30 s de escribirse (dirty_expire, por defecto).
vm.dirty_writeback_centisecs = 1500
