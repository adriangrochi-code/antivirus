# TISMA OS: tras 10 contraseñas fallidas seguidas la cuenta se bloquea 10 minutos (adivinar por fuerza bruta en
# la pantalla de bloqueo o en una terminal deja de ser práctico). root no se bloquea: no puede iniciar sesión.
dir = /var/run/faillock
audit
deny = 10
fail_interval = 900
unlock_time = 600
