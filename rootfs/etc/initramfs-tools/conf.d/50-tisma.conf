# Initramfs mínimo: solo los módulos de ESTE equipo (centinela ajusta el compresor tras medir)
# «most» en la imagen (en un chroot «dep» no puede deducir el disco y rompe la build); centinela pone «dep»
# en el sistema instalado (60-centinela-tuned.conf), cuando ya conoce el hardware real
MODULES=most
COMPRESS=zstd
COMPRESSLEVEL=3
