# Quita del sistema instalado lo que solo sirve en el USB. El de Debian pedía «remove» de paquetes que TISMA no
# trae (live-boot-doc, live-tools, live-task-…): sin las listas de los repositorios en la imagen, apt no los
# encuentra y la instalación FALLABA al final (visto en QEMU). try_remove: lo que no esté, se ignora.
---
backend: apt
update_db: false
update_system: false
operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-boot-initramfs-tools
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - live-task-localisation
      - live-task-recommended
      - user-setup
      - calamares-settings-debian
