# Tras dejar las fuentes de Debian definitivas (sources-final): descarga lo de la base que no va en la ISO
# (LibreOffice, fuentes CJK). Sin conexión no falla la instalación («-»): lo completa tisma-completar.service
# en el primer arranque con red.
dontChroot: false
timeout: 3600
script:
    - "-/usr/bin/tisma-perfil completar"
i18n:
    name: "Descargando LibreOffice y el resto de la base"
