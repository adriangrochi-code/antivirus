# Tras dejar las fuentes de Debian definitivas (sources-final): descarga lo de la base que no va en la ISO
# (LibreOffice, fuentes CJK). Sin conexión no falla la instalación («-»): lo completa tisma-completar.service
# en el primer arranque con red.
dontChroot: false
timeout: 3600
script:
    # Kernel de arranque según Secure Boot YA en el primer arranque: sin esto GRUB elegía el kernel TISMA (versión
    # más alta) y con Secure Boot y la clave sin registrar no arrancaba («bad shim signature»)
    # En un equipo real el kernel TISMA «minimal» (solo para máquinas virtuales) se quita: en la A275 GRUB lo dejó
    # primero y Secure Boot lo rechazaba («firma shim incorrecta»)
    # La ISO no lleva los initramfs de /boot (pesaban ~150 MB repetidos): el módulo initramfs los crea; si a algún
    # kernel le faltara, se crea aquí (antes de elegir el kernel y rehacer el menú de arranque)
    - "-/bin/sh -c 'PATH=/usr/sbin:/usr/bin:/sbin:/bin; for d in /lib/modules/*; do v=${d##*/}; [ -e /boot/initrd.img-$v ] || update-initramfs -c -k $v; done'"
    # Disco cifrado: TRIM del SSD a través del cifrado (el instalador deja /etc/crypttab sin opciones)
    - "-/usr/lib/tisma/crypttab-discard"
    - "-/usr/bin/tisma-secureboot quitar-minimal"
    - "-/usr/bin/tisma-secureboot elegir"
    # Arranque a prueba de fallos (06_tisma_fallos) activo YA desde el primer arranque: su contador vive en la
    # partición EFI
    - "-/bin/sh -c 'mountpoint -q /boot/efi && mkdir -p /boot/efi/tisma && { [ -e /boot/efi/tisma/grubenv ] || /usr/bin/grub-editenv /boot/efi/tisma/grubenv create; }'"
    # Como mucho 20 min de descarga aquí (antes podía tener el instalador parado hasta 1 h con internet lento y
    # luego cortarlo a la fuerza): lo que no llegue lo termina tisma-completar en el primer arranque
    - "-/usr/bin/env TISMA_LIMITE_DESCARGA=1200 /usr/bin/tisma-perfil completar"
    # Comprobación final SIN «-»: si el menú de arranque no carga el initramfs (el sistema no arrancaría: «Unable to
    # mount root fs», A275), el instalador lo dice en vez de terminar «bien» con un equipo que no arranca
    - "/usr/bin/tisma-secureboot verificar"
i18n:
    name: "Descargando LibreOffice y el resto de la base"
