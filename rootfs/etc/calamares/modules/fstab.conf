# Instalador: fstab y crypttab. Base: el de Debian (calamares-settings-debian 13). Cambio de TISMA: «discard» en
# crypttab ya estaba en el de Debian y se conserva junto a keyscript=/bin/cat (sin él, el sistema cifrado no
# encuentra la clave del initramfs y no desbloquea el disco al arrancar). «discard» deja pasar el TRIM a través
# de LUKS (contrapartida conocida: revela qué bloques están libres, no su contenido). Las opciones de montaje
# reales las pone mount.conf (noatime, compress=zstd:1, discard=async en btrfs).
---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime
ssdExtraMountOptions:
    xfs: discard
    swap: discard
crypttabOptions: luks,discard,keyscript=/bin/cat
