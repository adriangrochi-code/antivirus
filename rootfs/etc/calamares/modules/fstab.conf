# Instalador: crypttab. «discard» deja pasar el TRIM a través del cifrado LUKS: sin él, discard=async de
# btrfs y fstrim no llegaban al SSD, que se va llenando de bloques «ocupados» y pierde velocidad de escritura
# con el tiempo. (Contrapartida conocida: revela qué bloques están libres, no su contenido.)
crypttabOptions: luks,discard
tmpOptions:
    default: ""
    ssd: ""
