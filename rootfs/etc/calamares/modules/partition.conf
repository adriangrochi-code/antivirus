# Instalador: cifrado de disco completo disponible y recomendado (portátiles robados).
# /boot va en su propia partición SIN cifrar (solo el kernel y el arranque, firmados para Secure Boot) y todo lo
# demás en LUKS2 con argon2id. Así la contraseña del disco la pide la pantalla de arranque gráfica, con el teclado
# en español y en 1-2 s (antes la pedía GRUB: en inglés, sin ñ ni símbolos en su sitio y ~20 s en el A12).
# Calamares no crea el archivo de llave cuando /boot no está cifrado (luksbootkeyfile): la llave nunca queda a la
# vista. Pendiente: desbloqueo con TPM2 como BitLocker.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
userSwapChoices: [file]
initialSwapChoice: file
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
# Como Windows: se elige el disco (o junto a otro sistema) y nada más; sin particionado manual, sin elegir sistema
# de archivos ni LVM. Borrar el disco ya viene elegido.
initialPartitioningChoice: erase
allowManualPartitioning: false
showNotEncryptedBootMessage: false
lvm:
    enable: false
partitionLayout:
    - name: "TISMA-arranque"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1G
    - name: "TISMA"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
# Cifrado del disco MARCADO por defecto (se puede desmarcar): un portátil robado sin cifrar entrega todos los
# archivos, contraseñas guardadas y sesiones abiertas. Windows 10 Home no trae BitLocker; aquí viene de serie.
# LUKS1 porque GRUB descifra /boot (en el A12 desbloquear tarda unos segundos más que sin cifrar).
preCheckEncryption: true
# btrfs: instantáneas de solo lectura antes de cada actualización (tisma-copias)
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs"]
