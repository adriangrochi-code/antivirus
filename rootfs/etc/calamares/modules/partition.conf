# Instalador: cifrado de disco completo disponible y recomendado (portátiles robados).
# LUKS1: con el particionado automático /boot queda dentro del volumen cifrado y GRUB no sabe abrir LUKS2
# con argon2id (el sistema instalado no arrancaría). Pendiente: /boot aparte o UKI + LUKS2/TPM.
efiSystemPartition: "/boot/efi"
userSwapChoices: [none, file]
initialSwapChoice: none
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
# btrfs: instantáneas de solo lectura antes de cada actualización (tisma-copias)
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
