# Bienvenida: solo comprueba que el equipo sirve. Sin enlaces de donaciones ni de soporte (el equipo es del usuario,
# no una web).
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    30
    requiredRam:        2.0
    internetCheckUrl:   https://deb.debian.org
    check:
        - storage
        - ram
        - power
        - root
        - screen
    # Imprescindibles. Sin enchufar solo se avisa. Internet no se comprueba: sin red no pasa nada (LibreOffice y
    # el resto se descargan en el primer arranque con conexión) y el aviso amarillo asustaba sin motivo.
    required:
        - storage
        - ram
        - root

geoip:
    style:    "none"
