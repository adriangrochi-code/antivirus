# Tu cuenta (la única pregunta además del disco). Grupos de Debian; root sin contraseña (se administra con sudo,
# como en Ubuntu); contraseña de al menos 8 caracteres y sin inicio de sesión automático (seguridad primero).
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
doAutologin:     false
passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "tisma-${product}"
  forbidden_names: [ localhost ]
