# Hora (por ubicación), formatos en español del país y el teclado de la sesión, sin preguntar.
# También deja la marca que usa el menú del USB para arrancar el sistema instalado si el USB sigue puesto.
dontChroot: true
timeout: 180
script:
    - "/usr/lib/tisma/instalar-region ${ROOT}"
    - "-/usr/bin/touch ${ROOT}/boot/tisma-instalado"
    # El icono «Instalar TISMA OS» es solo para el USB: que no salga en el escritorio del sistema instalado
    - "-/bin/rm -f ${ROOT}/etc/skel/Escritorio/instalar-tisma.desktop"
    - "-/bin/rmdir ${ROOT}/etc/skel/Escritorio"
i18n:
    name: "Ajustando la hora, el idioma y el teclado"
