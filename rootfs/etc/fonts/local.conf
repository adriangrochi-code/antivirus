<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- TISMA: texto nítido en pantallas de poca resolución (1366×768, como la ThinkPad A275), también en Chromium y
     en las apps de TISMA (usan fontconfig): suavizado por subpíxel RGB (la mayoría de las pantallas de portátil),
     ajuste ligero a la cuadrícula de píxeles (bordes más definidos sin deformar las letras) y filtro LCD que evita
     bordes de colores. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
