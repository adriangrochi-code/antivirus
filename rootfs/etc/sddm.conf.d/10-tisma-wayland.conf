# Pantalla de inicio de sesión sobre Wayland (kwin), como el escritorio. TISMA no instala el servidor X: con la
# configuración de Debian (X11) sddm no arrancaba en el sistema instalado y la pantalla se quedaba negra (en el USB
# no se notaba porque entra solo, sin pantalla de inicio). Wayland además aísla mejor las ventanas entre sí.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
