# TISMA: hora del sistema AUTENTICADA con NTS (Network Time Security, RFC 8915).
# Una hora falsa permite usar certificados caducados o revocados y descuadra registros y copias.
# Sin servidores NTP sin autenticar ni los que anuncie el DHCP de la red (podría ser una red hostil).
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
# Hacen falta al menos 2 servidores que coincidan: uno solo no puede mover el reloj.
minsources 2
# Primer arranque con el reloj muy desfasado: aceptar los certificados NTS aunque la fecha no cuadre
# (solo para la sincronización inicial; las firmas NTS siguen comprobándose).
nocerttimecheck 1

confdir /etc/chrony/conf.d
sourcedir /etc/chrony/sources.d
keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
maxupdateskew 100.0
rtcsync
makestep 1 3
leapsectz right/UTC
