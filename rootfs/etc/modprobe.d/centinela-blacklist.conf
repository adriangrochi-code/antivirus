# ===== TISMA OS: módulos raros con historial de vulnerabilidades =====
# "install X /bin/false" impide incluso la carga automática por un atacante.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false
# Sistemas de archivos obsoletos o poco auditados
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install ksmbd /bin/false
# Firewire: acceso DMA directo a la memoria
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
# Pruebas del kernel
install vivid /bin/false

# ----- Ampliación (noviembre de 2026), según las CVE abiertas en kernel.org y las campañas de búsqueda con IA
# (OpenAI: 948 escaladas de privilegios locales en Linux; Microsoft: 33 CVE). La mayoría se alcanzan desde un
# espacio de nombres de usuario sin privilegios (que bubblewrap, Flatpak y Chromium necesitan, así que no se
# puede apagar) pidiendo un protocolo o un clasificador exótico: el kernel carga el módulo solo. Un escritorio no
# usa nada de esto; el código que no se carga no se puede atacar.
# Protocolos de red raros
install hsr /bin/false
install phonet /bin/false
install caif /bin/false
install kcm /bin/false
install smc /bin/false
install qrtr /bin/false
install llc2 /bin/false
install ieee802154_socket /bin/false
install 6lowpan /bin/false
# Control de tráfico (net/sched) de routers: clasificadores, acciones y colas exóticas. Se mantienen las que usa
# un escritorio: fq, fq_codel, cake, htb, tbf, ingress, prio (control de ancho de banda, VPN)
install cls_u32 /bin/false
install cls_fw /bin/false
install cls_flow /bin/false
install cls_route /bin/false
install cls_basic /bin/false
install cls_flower /bin/false
install act_pedit /bin/false
install act_ct /bin/false
install act_skbedit /bin/false
install act_vlan /bin/false
install act_tunnel_key /bin/false
install act_nat /bin/false
install act_mirred /bin/false
install sch_qfq /bin/false
install sch_hfsc /bin/false
install sch_taprio /bin/false
install sch_ets /bin/false
install sch_drr /bin/false
install sch_multiq /bin/false
install sch_choke /bin/false
install sch_sfb /bin/false
install sch_gred /bin/false
install sch_teql /bin/false
install sch_cbs /bin/false
install sch_plug /bin/false
# Sistemas de archivos de clúster o en desuso
install ocfs2 /bin/false
install gfs2 /bin/false
install nilfs2 /bin/false
install befs /bin/false
install qnx4 /bin/false
install qnx6 /bin/false
install sysv /bin/false
install ufs /bin/false
install omfs /bin/false
install adfs /bin/false
install affs /bin/false
install efs /bin/false
