<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- TISMA Cristal (claro): la misma aurora en tonos pastel. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5FC"/><stop offset="1" stop-color="#ECE8F6"/>
    </linearGradient>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0"/></filter>
    <filter id="niebla" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="260"/></filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#fondo)"/>
  <g filter="url(#niebla)">
    <ellipse cx="1050" cy="1520" rx="1250" ry="620" fill="#C4A7F5" opacity="0.65"/>
    <ellipse cx="2900" cy="1180" rx="1050" ry="560" fill="#A5C8F8" opacity="0.6"/>
    <ellipse cx="2050" cy="560" rx="900" ry="380" fill="#F5C6E8" opacity="0.45"/>
    <ellipse cx="3350" cy="1900" rx="650" ry="330" fill="#A7F3E4" opacity="0.4"/>
  </g>
  <!-- Grano muy fino: evita los escalones (bandeado) en los degradados -->
  <rect width="3840" height="2160" filter="url(#grano)" opacity="0.035"/>
</svg>
